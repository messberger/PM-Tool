<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-Tool</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: linear-gradient(135deg, #fff5e6 0%, #ffe8cc 100%); color: #333; min-height: 100vh; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { color: #FF8C00; text-align: center; margin-bottom: 10px; font-size: 2.5em; }
        .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
        .stats-box { background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%); padding: 20px; margin-bottom: 30px; border-radius: 12px; border-left: 5px solid #FF8C00; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .stat-item strong { color: #FF8C00; font-size: 24px; }
        .panel { background: white; padding: 30px; margin-bottom: 30px; border-radius: 15px; box-shadow: 0 8px 25px rgba(255, 140, 0, 0.15); border-top: 5px solid #FF8C00; }
        .panel-title { color: #FF8C00; font-size: 20px; margin-bottom: 20px; font-weight: 600; border-bottom: 2px solid #FFE0B2; padding-bottom: 10px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #FFE0B2; border-radius: 8px; font-family: inherit; }
        input:focus, select:focus { outline: none; border-color: #FF8C00; box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1); }
        button { padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.3s; }
        .btn-primary { width: 100%; background: linear-gradient(135deg, #FF8C00 0%, #FF9500 100%); color: white; font-size: 16px; padding: 14px; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3); }
        .btn-small { background: #4CAF50; color: white; padding: 8px 14px; font-size: 12px; width: auto; margin-right: 8px; }
        .btn-small:hover { background: #45a049; }
        .btn-delete { background: #f44336; color: white; padding: 6px 10px; font-size: 12px; width: auto; }
        .btn-delete:hover { background: #da190b; }
        .project-tag { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #FF8C00 0%, #FF9500 100%); color: white; padding: 8px 12px; border-radius: 20px; font-size: 13px; font-weight: 500; margin: 5px; }
        .project-tag button { background: none; border: none; color: white; font-size: 14px; cursor: pointer; padding: 0; }
        .project-tag button:hover { opacity: 0.8; }
        .task { display: flex; justify-content: space-between; align-items: center; padding: 18px; margin-bottom: 12px; background: linear-gradient(135deg, #FFF9F5 0%, #FFF5EE 100%); border-left: 4px solid #FF8C00; border-radius: 10px; border: 1px solid #FFE0B2; }
        .task:hover { transform: translateX(5px); box-shadow: 0 4px 12px rgba(255, 140, 0, 0.15); }
        .task-title { font-weight: 600; margin-bottom: 8px; }
        .task-meta { font-size: 12px; color: #999; }
        label { display: block; font-weight: 600; margin-bottom: 8px; }
        .empty { text-align: center; color: #999; padding: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Projekt Manager</h1>
        <div class="subtitle">Dein Taskmanagement System</div>
        
        <div class="stats-box">
            <div class="stat-item">📌 Offene: <strong id="openCount">0</strong></div>
            <div class="stat-item">✅ Erledigt: <strong id="doneCount">0</strong></div>
        </div>

        <div class="panel">
            <div class="panel-title">⚙️ Deine Projekte</div>
            <div id="projects"></div>
            <button class="btn-primary" onclick="addProjectModal()" style="margin-top: 20px;">+ Neues Projekt</button>
        </div>

        <div class="panel">
            <div class="panel-title">➕ Neue Aufgabe</div>
            <label>Aufgabe</label>
            <input type="text" id="taskTitle" placeholder="Was muss getan werden?">
            <label>Projekt</label>
            <select id="taskProject"><option>-- Wählen --</option></select>
            <label>Fällig am</label>
            <input type="date" id="taskDueDate">
            <button class="btn-primary" onclick="addTask()">Aufgabe hinzufügen</button>
        </div>

        <div class="panel">
            <div class="panel-title">📌 Aufgaben (<span id="taskCount">0</span>)</div>
            <div id="tasks" class="empty">Keine Aufgaben!</div>
        </div>
    </div>

    <script>
        const PROJECTS_KEY = 'pm_projects';
        const TASKS_KEY = 'pm_tasks';
        
        const DEFAULT_PROJECTS = ['Utzmannsbach', 'Kastellstraße 86', 'Haus Mulzer', 'Halle (Wittenberger)', 'Lindenfels', 'Bad Schwalbach', 'Gleditschstraße 32', 'Plasteblock 683', 'Marketing & Social Media', 'Admin & Büro', 'Auto & Fahrtkosten', 'Studio Messberger', 'KI Workshop', 'Plaza Cleaning', 'Sonstiges'];

        function initProjects() {
            if (!localStorage.getItem(PROJECTS_KEY)) {
                localStorage.setItem(PROJECTS_KEY, JSON.stringify(DEFAULT_PROJECTS));
            }
        }

        function getProjects() {
            return JSON.parse(localStorage.getItem(PROJECTS_KEY) || '[]');
        }

        function getTasks() {
            return JSON.parse(localStorage.getItem(TASKS_KEY) || '[]');
        }

        function saveTasks(tasks) {
            localStorage.setItem(TASKS_KEY, JSON.stringify(tasks));
        }

        function saveProjects(projects) {
            localStorage.setItem(PROJECTS_KEY, JSON.stringify(projects));
        }

        function render() {
            renderProjects();
            renderProjectSelect();
            renderTasks();
        }

        function renderProjects() {
            const projects = getProjects();
            const html = projects.map(p => `<div class="project-tag">${p} <button onclick="deleteProject('${p}')">×</button></div>`).join('');
            document.getElementById('projects').innerHTML = html || '<p style="color: #999;">Keine Projekte</p>';
        }

        function renderProjectSelect() {
            const projects = getProjects();
            const select = document.getElementById('taskProject');
            select.innerHTML = '<option>-- Wählen --</option>' + projects.map(p => `<option>${p}</option>`).join('');
        }

        function renderTasks() {
            const tasks = getTasks().filter(t => !t.done);
            const done = getTasks().filter(t => t.done).length;
            document.getElementById('openCount').textContent = tasks.length;
            document.getElementById('doneCount').textContent = done;
            document.getElementById('taskCount').textContent = tasks.length;
            
            if (tasks.length === 0) {
                document.getElementById('tasks').innerHTML = '<div class="empty">Keine Aufgaben! 🎉</div>';
                return;
            }

            let html = '';
            tasks.forEach((t, i) => {
                const dueDate = t.due ? new Date(t.due).toLocaleDateString('de-DE') : '';
                html += `<div class="task">
                    <div>
                        <div class="task-title">${t.title}</div>
                        ${t.project ? `<div class="task-meta">📁 ${t.project}</div>` : ''}
                        ${dueDate ? `<div class="task-meta">📅 ${dueDate}</div>` : ''}
                    </div>
                    <div>
                        <button class="btn-small" onclick="completeTask(${i})">✓</button>
                        <button class="btn-delete" onclick="deleteTask(${i})">🗑️</button>
                    </div>
                </div>`;
            });
            document.getElementById('tasks').innerHTML = html;
        }

        function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const project = document.getElementById('taskProject').value;
            const due = document.getElementById('taskDueDate').value;
            
            if (!title) { alert('Aufgabe eintragen!'); return; }
            
            const tasks = getTasks();
            tasks.push({ title, project: project === '-- Wählen --' ? '' : project, due, done: false });
            saveTasks(tasks);
            
            document.getElementById('taskTitle').value = '';
            document.getElementById('taskProject').value = '-- Wählen --';
            document.getElementById('taskDueDate').value = '';
            render();
        }

        function completeTask(i) {
            const tasks = getTasks();
            tasks[i].done = true;
            saveTasks(tasks);
            render();
        }

        function deleteTask(i) {
            if (!confirm('Löschen?')) return;
            const tasks = getTasks();
            tasks.splice(i, 1);
            saveTasks(tasks);
            render();
        }

        function deleteProject(name) {
            if (!confirm('Projekt löschen?')) return;
            const projects = getProjects().filter(p => p !== name);
            saveProjects(projects);
            render();
        }

        function addProjectModal() {
            const name = prompt('Neues Projekt (z.B. Hafeninsel):');
            if (!name) return;
            const projects = getProjects();
            if (projects.includes(name)) { alert('Existiert schon!'); return; }
            projects.push(name);
            saveProjects(projects);
            render();
        }

        initProjects();
        render();
    </script>
</body>
</html>
