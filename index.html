<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PM-Tool - Projektmanagement</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #fff5e6 0%, #ffe8cc 100%);
            color: #333;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #FF8C00;
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5em;
            text-shadow: 2px 2px 4px rgba(255, 140, 0, 0.1);
        }
        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }
        .stats-box {
            background: linear-gradient(135deg, #FFF3E0 0%, #FFE0B2 100%);
            padding: 20px;
            margin-bottom: 30px;
            border-radius: 12px;
            border-left: 5px solid #FF8C00;
            box-shadow: 0 4px 15px rgba(255, 140, 0, 0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .stat-item {
            font-size: 16px;
            color: #333;
        }
        .stat-item strong {
            color: #FF8C00;
            font-size: 24px;
        }
        .input-panel {
            background: white;
            padding: 30px;
            margin-bottom: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.15);
            border-top: 5px solid #FF8C00;
        }
        .panel-title {
            color: #FF8C00;
            font-size: 20px;
            margin-bottom: 20px;
            font-weight: 600;
            border-bottom: 2px solid #FFE0B2;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        input, select {
            width: 100%;
            padding: 12px;
            font-size: 14px;
            border: 2px solid #FFE0B2;
            border-radius: 8px;
            font-family: 'Segoe UI', sans-serif;
            transition: all 0.3s;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #FF8C00;
            box-shadow: 0 0 0 3px rgba(255, 140, 0, 0.1);
        }
        button {
            padding: 12px 24px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }
        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #FF8C00 0%, #FF9500 100%);
            color: white;
            font-size: 16px;
            padding: 14px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(255, 140, 0, 0.3);
        }
        .btn-success {
            background-color: #4CAF50;
            color: white;
            padding: 8px 14px;
            font-size: 12px;
        }
        .btn-success:hover {
            background-color: #45a049;
            transform: translateY(-1px);
        }
        .btn-danger {
            background-color: #f44336;
            color: white;
            padding: 6px 10px;
            font-size: 12px;
            width: auto;
        }
        .btn-danger:hover {
            background-color: #da190b;
            transform: translateY(-1px);
        }
        .btn-add-small {
            background: linear-gradient(135deg, #FF8C00 0%, #FF9500 100%);
            color: white;
            padding: 10px 16px;
            font-size: 13px;
        }
        .btn-add-small:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }
        .list-panel {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(255, 140, 0, 0.15);
            border-top: 5px solid #FF8C00;
        }
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px;
            margin-bottom: 12px;
            background: linear-gradient(135deg, #FFF9F5 0%, #FFF5EE 100%);
            border-left: 4px solid #FF8C00;
            border-radius: 10px;
            transition: all 0.3s;
            border: 1px solid #FFE0B2;
        }
        .task-item:hover {
            transform: translateX(5px);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.15);
        }
        .task-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        .task-meta {
            font-size: 12px;
            color: #999;
            margin: 4px 0;
        }
        .task-meta strong {
            color: #FF8C00;
        }
        .button-group {
            display: flex;
            gap: 8px;
            flex-shrink: 0;
        }
        .loading {
            text-align: center;
            color: #999;
            padding: 40px;
            font-style: italic;
        }
        .project-tag {
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, #FF8C00 0%, #FF9500 100%);
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            margin: 5px;
        }
        .project-tag button {
            background: rgba(255,255,255,0.3);
            border: none;
            color: white;
            width: auto;
            padding: 2px 6px;
            margin: 0;
            cursor: pointer;
            border-radius: 50%;
            font-size: 14px;
        }
        .project-tag button:hover {
            background: rgba(255,255,255,0.5);
        }
        .project-list {
            display: flex;
            flex-wrap: wrap;
            gap: 0;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #FFE0B2;
        }
        .add-project-row {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid #FFE0B2;
        }
        .add-project-row input {
            flex: 1;
            padding: 10px;
            border: 2px solid #FFE0B2;
            border-radius: 8px;
        }
        .add-project-row button {
            background: linear-gradient(135deg, #FF8C00 0%, #FF9500 100%);
            color: white;
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
        }
        .add-project-row button:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 140, 0, 0.3);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Projekt Manager</h1>
        <div class="subtitle">Dein digitales Taskmanagement System</div>
        
        <div class="stats-box">
            <div class="stat-item">📌 Offene Aufgaben: <strong id="openCount">0</strong></div>
            <div class="stat-item">✅ Erledigt: <strong id="doneCount">0</strong></div>
        </div>

        <div class="input-panel">
            <div class="panel-title">➕ Neue Aufgabe</div>
            
            <div class="form-group">
                <label>Aufgabe</label>
                <input type="text" id="taskTitle" placeholder="Was muss getan werden?">
            </div>

            <div class="form-group">
                <label>Projekt</label>
                <select id="taskProject">
                    <option value="">-- Wählen --</option>
                </select>
            </div>

            <div class="form-group">
                <label>Fällig am</label>
                <input type="date" id="taskDueDate">
            </div>

            <button class="btn-primary" onclick="addTask()">Aufgabe hinzufügen</button>
        </div>

        <div class="list-panel">
            <div class="panel-title">📌 Aufgaben (<span id="taskCount">0</span>)</div>
            <div id="tasksList" class="loading">Lädt...</div>
        </div>

        <div class="input-panel" style="margin-top: 30px;">
            <div class="panel-title">⚙️ Projekte verwalten</div>
            <div class="project-list" id="projectList"></div>
            <div class="add-project-row">
                <input type="text" id="newProjectInput" placeholder="Neues Projekt (z.B. Hafeninsel)">
                <button onclick="createProject()">+ Projekt</button>
            </div>
        </div>
    </div>

    <script>
        // Supabase Config
        const SUPABASE_URL = 'https://xcyfbuujqqnhgquijtpq.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_w-zKJsjMPCdpPc5S2_uGkQ_47MV_mSN';
        const { createClient } = window.supabase;
        const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

        // Load on page load
        window.addEventListener('load', () => {
            loadProjects();
            loadTasks();
        });

        // ===== PROJECTS =====
        async function loadProjects() {
            try {
                const { data, error } = await supabase
                    .from('projects')
                    .select('*')
                    .order('name', { ascending: true });

                if (error) throw error;
                
                displayProjectsInSelect(data || []);
                displayProjectsTags(data || []);
            } catch (error) {
                console.error('Fehler:', error);
            }
        }

        function displayProjectsInSelect(projects) {
            const select = document.getElementById('taskProject');
            select.innerHTML = '<option value="">-- Wählen --</option>';
            projects.forEach(p => {
                const opt = document.createElement('option');
                opt.value = p.name;
                opt.textContent = p.name;
                select.appendChild(opt);
            });
        }

        function displayProjectsTags(projects) {
            const projectList = document.getElementById('projectList');
            if (projects.length === 0) {
                projectList.innerHTML = '<p style="color: #999; font-style: italic;">Keine Projekte vorhanden</p>';
                return;
            }
            projectList.innerHTML = projects.map(p => `
                <div class="project-tag">
                    ${p.name}
                    <button onclick="deleteProject(${p.id})" title="Löschen">×</button>
                </div>
            `).join('');
        }

        async function createProject() {
            const name = document.getElementById('newProjectInput').value.trim();
            if (!name) {
                alert('Bitte Projektnamen eingeben!');
                return;
            }

            try {
                const { error } = await supabase
                    .from('projects')
                    .insert([{ name }]);

                if (error) throw error;
                document.getElementById('newProjectInput').value = '';
                loadProjects();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        async function deleteProject(id) {
            if (!confirm('Projekt löschen?')) return;

            try {
                const { error } = await supabase
                    .from('projects')
                    .delete()
                    .eq('id', id);

                if (error) throw error;
                loadProjects();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        // ===== TASKS =====
        async function loadTasks() {
            try {
                const { data, error } = await supabase
                    .from('tasks')
                    .select('*')
                    .order('due_date', { ascending: true, nullsLast: true });

                if (error) throw error;
                displayTasks(data || []);
            } catch (error) {
                console.error('Fehler:', error);
                document.getElementById('tasksList').innerHTML = '<p style="color: red;">Fehler beim Laden: ' + error.message + '</p>';
            }
        }

        function displayTasks(tasks) {
            const openTasks = tasks.filter(t => !t.done);
            const doneTasks = tasks.filter(t => t.done);

            document.getElementById('openCount').textContent = openTasks.length;
            document.getElementById('doneCount').textContent = doneTasks.length;
            document.getElementById('taskCount').textContent = openTasks.length;

            if (openTasks.length === 0) {
                document.getElementById('tasksList').innerHTML = '<p style="color: #999; text-align: center;">Keine offenen Aufgaben! 🎉</p>';
                return;
            }

            let html = '';
            openTasks.forEach(task => {
                const dueDate = task.due_date ? new Date(task.due_date).toLocaleDateString('de-DE') : 'Kein Datum';
                html += `
                    <div class="task-item">
                        <div style="flex: 1;">
                            <div class="task-title">${escapeHtml(task.title)}</div>
                            ${task.project ? `<div class="task-meta">📁 <strong>${escapeHtml(task.project)}</strong></div>` : ''}
                            ${task.due_date ? `<div class="task-meta">📅 ${dueDate}</div>` : ''}
                        </div>
                        <div class="button-group">
                            <button class="btn-success" onclick="completeTask(${task.id})">✓ Fertig</button>
                            <button class="btn-danger" onclick="deleteTask(${task.id})">🗑️</button>
                        </div>
                    </div>
                `;
            });
            document.getElementById('tasksList').innerHTML = html;
        }

        async function addTask() {
            const title = document.getElementById('taskTitle').value.trim();
            const project = document.getElementById('taskProject').value || null;
            const dueDate = document.getElementById('taskDueDate').value || null;

            if (!title) {
                alert('Bitte Aufgabe eintragen!');
                return;
            }

            try {
                const { error } = await supabase.from('tasks').insert([
                    { title, project, due_date: dueDate, done: false }
                ]);

                if (error) throw error;
                
                document.getElementById('taskTitle').value = '';
                document.getElementById('taskProject').value = '';
                document.getElementById('taskDueDate').value = '';
                
                loadTasks();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        async function completeTask(id) {
            try {
                const { error } = await supabase.from('tasks').delete().eq('id', id);
                if (error) throw error;
                loadTasks();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        async function deleteTask(id) {
            if (!confirm('Aufgabe löschen?')) return;

            try {
                const { error } = await supabase.from('tasks').delete().eq('id', id);
                if (error) throw error;
                loadTasks();
            } catch (error) {
                alert('Fehler: ' + error.message);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Enter-Taste
        document.addEventListener('keypress', (e) => {
            if (e.target.id === 'taskTitle' && e.key === 'Enter') addTask();
            if (e.target.id === 'newProjectInput' && e.key === 'Enter') createProject();
        });
    </script>
</body>
</html>
